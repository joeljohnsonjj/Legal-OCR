services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ocr-qdrant
    network_mode: host
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  legal-ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ocr-api
    network_mode: host
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8061
      API_RELOAD: "false"
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: 6333
      DOCS_FOLDER: docs
      OUTPUT_FOLDER: output
      LOGS_FOLDER: logs
      CACHE_FOLDER: ocr_cache
      PROMPT_FILE: prompt.txt
    volumes:
      - ./logs:/app/logs
      - ./ocr_cache:/app/ocr_cache
      - ./output:/app/output
      - ./query_results:/app/query_results
      - ./docs:/app/docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8061/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  qdrant_data:
