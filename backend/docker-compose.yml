services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ocr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  legal-ocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ocr-api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      RAG_INDEX_QDRANT: ${RAG_INDEX_QDRANT:-true}
      SESSION_PROVIDER: ${SESSION_PROVIDER:-sqlite}
      SESSION_DB_PATH: ${SESSION_DB_PATH:-/app/output/session_store.sqlite}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_RELOAD: ${API_RELOAD:-false}
      DOCS_FOLDER: ${DOCS_FOLDER:-docs}
      OUTPUT_FOLDER: ${OUTPUT_FOLDER:-output}
      LOGS_FOLDER: ${LOGS_FOLDER:-logs}
      CACHE_FOLDER: ${CACHE_FOLDER:-ocr_cache}
      PROMPT_FILE: ${PROMPT_FILE:-prompt.txt}
    
    volumes:
      - ./logs:/app/logs
      - ./ocr_cache:/app/ocr_cache
      - ./output:/app/output
      - ./query_results:/app/query_results
      - ./docs:/app/docs
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  qdrant_data:
