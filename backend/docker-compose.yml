services:
  # Fake GCS Server (Docker-based) - Optional if using standalone run_emulator.py
  # Uncomment this service if you want to use Docker-based emulator instead of run_emulator.py
  # fake-gcs-server:
  #   image: fsouza/fake-gcs-server:latest
  #   container_name: fake-gcs-server
  #   ports:
  #     - "4443:4443"
  #   command: -scheme http -port 4443 -backend memory -filesystem-root /storage
  #   volumes:
  #     - ./fake-gcs-data:/storage
  #   restart: unless-stopped

  heb-legal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heb-legal-ocr-api
    ports:
      - "8000:8000"
    # Uncomment if using Docker-based fake-gcs-server
    # depends_on:
    #   - fake-gcs-server
    environment:
      # Google Cloud Configuration
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # GCS Configuration
      - GCS_BUCKET=${GCS_BUCKET:-heb-legal}
      - GCS_DOCS_FOLDER=${GCS_DOCS_FOLDER:-Documents}
      - GCS_OUTPUT_FOLDER=${GCS_OUTPUT_FOLDER:-Output}
      # Note: For Docker, use fake-gcs-server service. For local, use localhost:4443
      - STORAGE_EMULATOR_HOST=${STORAGE_EMULATOR_HOST:-http://fake-gcs-server:4443}
      - FAKE_GCS_ENDPOINT=${FAKE_GCS_ENDPOINT:-http://fake-gcs-server:4443}
      
      # Processing Configuration
      - PROMPT_FILE=${PROMPT_FILE:-prompt.txt}
      - DOCS_FOLDER=${DOCS_FOLDER:-docs}
      - OUTPUT_FOLDER=${OUTPUT_FOLDER:-output}
      - LOGS_FOLDER=${LOGS_FOLDER:-logs}
      - CACHE_FOLDER=${CACHE_FOLDER:-ocr_cache}
      
      # API Configuration
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - API_RELOAD=${API_RELOAD:-false}
    
    volumes:
      # Mount directories for persistent data
      - ./logs:/app/logs
      - ./ocr_cache:/app/ocr_cache
      - ./output:/app/output
      - ./query_results:/app/query_results
      - ./docs:/app/docs
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

