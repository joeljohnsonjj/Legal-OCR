# Combined library: session manager + Mem0 memory. Install with: pip install -e ./memory_management
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-management"
version = "1.1.0"
description = "Session management and Mem0 memory library for chatbots"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "G10X Technology", email = "contact@g10x.com"}
]
keywords = ["session", "memory", "mem0", "chatbot", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.34.0",
    "langchain-aws>=0.1.0",
    "mem0ai>=0.1.0",
    "opik>=0.1.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
# Decorators use opik + optional opik_template when installed (see adapter/compaction); opik is a core dependency.
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/your-org/memory-management"
Repository = "https://github.com/your-org/memory-management.git"

[tool.setuptools.package-dir]
"memory_management" = "."
"memory_management.memory" = "memory"
"memory_management.session_manager" = "session_manager"

[tool.setuptools]
packages = [
    "memory_management",
    "memory_management.memory",
    "memory_management.session_manager",
    "memory_management.session_manager.core",
    "memory_management.session_manager.observability",
    "memory_management.session_manager.services",
    "memory_management.session_manager.storage",
    "memory_management.session_manager.workers",
]
